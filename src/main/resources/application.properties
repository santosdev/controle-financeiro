spring.application.name=FinanceControl

# Banco de dados (MySQL). A senha vem da variavel de ambiente DB_PASSWORD, nunca fica no codigo.
spring.datasource.url=jdbc:mysql://localhost:3306/financecontrol?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

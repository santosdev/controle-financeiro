spring.application.name=FinanceControl

# ---------------------------------------------------------------------------
# Banco de dados (PostgreSQL)
# A senha vem da variavel de ambiente DB_PASSWORD, nunca fica no codigo.
# O esquema e criado pelo Flyway (src/main/resources/db/migration).
# ---------------------------------------------------------------------------
# Em producao defina DB_URL completa (ex.: jdbc:postgresql://host/banco?sslmode=require).
# Sem DB_URL, usa o PostgreSQL local (o banco precisa existir: createdb financecontrol).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME:financecontrol}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Servidor (hospedagens informam a porta pela variavel PORT)
# Atras do proxy HTTPS da hospedagem, usa os cabecalhos X-Forwarded-* para
# montar URLs corretas (necessario para o login com Google).
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---------------------------------------------------------------------------
# Sessao e cookies
# ---------------------------------------------------------------------------
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=FINANCECONTROL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Em producao (HTTPS) defina COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# Aplicacao
# ---------------------------------------------------------------------------
# Endereco publico do sistema: usado nos links enviados por e-mail.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Entrar com o Google. Deixe vazio para desativar (o botao some da tela).
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# E-mail (SMTP). Sem SPRING_MAIL_HOST os e-mails sao apenas impressos no log
# (util para desenvolvimento). Veja o README para configurar o Gmail.
# ---------------------------------------------------------------------------
app.mail.from=${MAIL_FROM:FinanceControl <no-reply@financecontrol.local>}
# Resend (API HTTPS): tem prioridade sobre o SMTP. Use em hospedagens que bloqueiam SMTP, como o Render gratuito.
# Sem MAIL_FROM, o remetente vira onboarding@resend.dev (so entrega para o e-mail da conta Resend).
app.mail.resend-api-key=${RESEND_API_KEY:}

# "Entrar como visitante": conta temporaria, apagada ao sair ou depois de 24 horas.
app.visitante.habilitado=${VISITANTE_HABILITADO:true}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · FinanceControl</title>
    <meta name="author" content="SantosDev">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='42' font-family='Segoe UI,Arial,sans-serif' font-size='28' font-weight='700' text-anchor='middle' fill='white'%3ESD%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/tema.js"></script>
</head>
<body class="pagina-auth" data-pagina="login">

<header class="auth-topo">
    <div class="marca">
        <div class="logo">Finance<span>Control</span></div>
        <a class="assinatura" href="https://github.com/santosdev" target="_blank" rel="noopener" title="Projeto de portfólio de SantosDev">by <b>SantosDev</b></a>
    </div>
    <button id="botao-tema" class="botao-tema" type="button" aria-label="Ativar modo escuro" title="Modo escuro">
        <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
</header>

<main class="auth-centro">
    <div class="auth-cartao">
        <h1>Entrar</h1>
        <p class="auth-sub">Acesse sua conta para ver as suas finanças.</p>

        <div id="mensagem" class="mensagem" role="alert" hidden></div>

        <a id="botao-google" class="botao-google" href="/oauth2/authorization/google" hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continuar com o Google
        </a>
        <div id="divisor" class="divisor" hidden><span>ou</span></div>

        <form id="form-login" class="auth-form" novalidate>
            <label class="campo">E-mail
                <input type="email" id="email" autocomplete="email" maxlength="160" autofocus>
                <span class="campo__erro" id="email-erro"></span>
            </label>
            <label class="campo">Senha
                <span class="campo-senha">
                    <input type="password" id="senha" autocomplete="current-password" maxlength="128">
                    <button type="button" class="ver-senha" aria-label="Mostrar senha">
                        <svg class="icone-ver" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icone-ocultar" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
                    </button>
                </span>
                <span class="campo__erro" id="senha-erro"></span>
            </label>
            <div class="linha-link"><a class="link" href="esqueci-senha.html">Esqueci minha senha</a></div>
            <button type="submit" id="botao-entrar" class="botao botao--cheio">Entrar</button>
            <div id="reenviar-area" class="linha-link linha-link--centro" hidden>
                <button type="button" id="botao-reenviar" class="link">Reenviar e-mail de confirmação</button>
            </div>
        </form>

        <p class="auth-rodape">Não tem conta? <a class="link" href="cadastro.html">Criar conta</a></p>
    </div>
</main>

<footer class="rodape">
    Desenvolvido por <a href="https://github.com/santosdev" target="_blank" rel="noopener">SantosDev</a> · FinanceControl
</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
